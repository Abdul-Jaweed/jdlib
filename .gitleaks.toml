# gitleaks configuration for JDLib (jdlib).
#
# Extends the upstream default ruleset (no rule is removed or disabled) and adds
# allowlist entries for reviewed, synthetic credential fixtures that live in the
# test suite. Every entry pins BOTH the file path and the exact reviewed value
# and uses `condition = "AND"`, so it can only ever suppress that one reviewed
# fixture: a real credential anywhere else -- including a new value or a new
# line in the same file -- is still reported and still fails the build.
#
# Review record: docs/security/ci-security.md (section "Secret scanning").
# Re-run `gitleaks detect` locally after editing this file and update the
# documentation with the reason for any new entry.

[extend]
useDefault = true

[[allowlists]]
description = "synthetic fixture in tests/integration/test_security_audit_persistence.py:220 (rule: generic-api-key)"
condition = "AND"
paths = ['''^tests/integration/test_security_audit_persistence\.py$''']
regexTarget = "secret"
regexes = ['''^abcdef123456789$''']

