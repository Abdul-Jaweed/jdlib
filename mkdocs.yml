# The JDLib documentation portal.
#
# The portal publishes the repository's existing documents rather than replacing them: each topic
# has exactly one design authority (see docs/development/documentation.md), and the navigation
# presents those authorities under the reader's question rather than under the directory they
# happen to live in. Pages written for the portal itself live in their section directory.
#
# Validation is explicit and strict: `mkdocs build --strict` turns every configured warning into a
# failure, which is what makes "no broken links" a claim the gate can check rather than a promise.
site_name: JDLib
site_description: >-
  A multi-tenant security foundation for PostgreSQL and Neo4j applications: authentication,
  authorization, tenancy, audit, reliability and observability as one enforced surface.
# This is an internal library: no public site URL is claimed, and the build is local/CI.
site_url: ""
repo_url: https://github.com/Abdul-Jaweed/jdlib
repo_name: Abdul-Jaweed/jdlib
edit_uri: edit/main/docs/
docs_dir: docs
strict: false  # the CLI flag decides; `--strict` is what CI runs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      separator: "[\\s\\-]+"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  # Mermaid: the fence is rendered by Material's bundled Mermaid integration. Diagrams are content
  # here, not decoration - each one is checked by tests/unit/test_docs_portal.py for a diagram type
  # the renderer actually supports.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# What the build refuses to tolerate. `--strict` makes each of these a failure.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: ignore
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore
    unrecognized_links: warn

# Internal programme records, not portal content: the phase plans are working documents written
# against earlier revisions, they are kept in the repository for the audit trail, and publishing
# them would put predecessor-era material in front of a reader looking for current behaviour.
exclude_docs: |
  superpowers/

