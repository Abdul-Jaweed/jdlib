# Collector configuration for the local infrastructure stack.
# Verifies what the application exports (directive §5, §28); traces and metrics
# are written to the debug exporter so their contents can be asserted.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 64

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
