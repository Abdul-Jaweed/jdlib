# Local infrastructure for the integration / infra / e2e test layers.
#
#   docker compose -f tests/infra/docker-compose.yml up -d
#   export TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1
#   pytest -q -W error -m "integration or infra"
#
# Credentials in this file are throwaway local values; never reuse them.

name: jdlib-infra

services:
  postgres:
    image: postgres:16
    container_name: jdlib-postgres
    environment:
      POSTGRES_USER: jdlib
      POSTGRES_PASSWORD: jdlib
      POSTGRES_DB: jdlib
    command: ["postgres", "-c", "max_connections=200", "-c", "log_statement=all"]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdlib -d jdlib"]
      interval: 2s
      timeout: 3s
      retries: 30

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.37.0
    container_name: jdlib-cerbos
    command: ["server", "--config=/config/cerbos.yaml", "--set=storage.disk.directory=/policies"]
    volumes:
      - ./cerbos:/config:ro
      - ./cerbos/policies:/policies:ro
    ports:
      - "127.0.0.1:3592:3592"
      - "127.0.0.1:3593:3593"

  redis:
    image: redis:7-alpine
    container_name: jdlib-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The graph engine. The library's graph namespace speaks bolt to this server; the
  # driver arrives as the `graph` extra, the server exists only for the live layer.
  # The password is a throwaway lab value like every other one in this file.
  neo4j:
    image: neo4j:5.26-community
    container_name: jdlib-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${JDLIB_INFRA_NEO4J_PASSWORD:-jdliblab}"
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "${JDLIB_INFRA_NEO4J_PASSWORD:-jdliblab}",
          "RETURN 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 60

  # The same image, the same config and the same published ports as
  # tests/infra/otel/start.sh. Both paths have to produce a collector the OTel
  # tests can actually verify: a compose-only config with the debug exporter and
  # no /out mount made three of them unpassable and let a fourth pass on a
  # store left behind by a previous session.
  otel-collector:
    image: ${JDLIB_INFRA_OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.110.0}
    container_name: jdlib-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ./out/otel:/out
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"

  # Identity provider for the infra-marked authentication tests.
  # Heavy: its own schema, first-run migrations, several hundred MB image.
  # Tests skip unless JDLIB_INFRA_ZITADEL_ISSUER is set - CI stays hermetic.
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: jdlib-zitadel
    depends_on:
      zitadel-db:
        condition: service_healthy
    command: ["start-from-init", "--masterkey", "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}", "--tlsMode", "disabled"]
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60

  zitadel-db:
    image: postgres:16
    container_name: jdlib-zitadel-db
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 2s
      timeout: 3s
      retries: 30
