receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 200ms
    send_batch_size: 16

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  # The proof this harness exists for: whatever arrives is written to a file the
  # test can read back, so "telemetry was emitted" is checked against what a
  # collector actually received rather than against a mock.
  file:
    path: /out/telemetry.jsonl
    rotation:
      max_megabytes: 4
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: normal

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      # The collector's own metrics, which is the honest proof that it is
      # running and collecting rather than merely listening.
      address: 0.0.0.0:8888
      level: basic
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file, prometheus]
