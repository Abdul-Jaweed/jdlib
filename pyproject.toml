[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jdlib"
version = "0.1.0"
description = "Reusable multi-tenant foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pglast>=6.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.111",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.5",
    "typer>=0.12",
]
fastapi = ["fastapi>=0.111"]
cli = ["typer>=0.12"]

[project.entry-points.pytest11]
jdlib = "jdlib.testing.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/jdlib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jdlib"]
