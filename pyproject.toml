[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jdlib"
version = "0.1.0"
description = "Reusable multi-tenant foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pglast>=6.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
# The Redis cache provider is optional: importing jdlib does not require the
# client, but using RedisCache does. Kept out of the base install on purpose.
redis = [
    "redis>=5.0",
]

dev = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.5",
    "typer>=0.12",
    # Phase 1 hygiene: coverage measurement and package build/install verification.
    "coverage>=7.5",
    "pytest-cov>=5.0",
    "build>=1.2",
]
# starlette is imported directly by src/jdlib/integrations/fastapi.py, so it is declared
# here rather than inherited by luck from fastapi's own dependency list.
fastapi = ["fastapi>=0.111", "starlette>=0.37"]
cli = ["typer>=0.12"]
http = ["httpx>=0.27"]

[project.entry-points.pytest11]
jdlib = "jdlib.testing.pytest_plugin"

[project.scripts]
jdlib = "jdlib.integrations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jdlib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, isolated tests with no external infrastructure",
    "integration: tests over real infrastructure (HTTP, PostgreSQL, Cerbos)",
    "infra: tests that depend on the local docker compose stack",
    "e2e: end-to-end authentication and authorisation flows",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jdlib"]

[tool.coverage.run]
source = ["jdlib"]
branch = true

[tool.coverage.report]
# No fail_under. Coverage here is evidence to report per phase, not a gate to satisfy:
# a number chosen to make a gate green measures the gate, not the code.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
