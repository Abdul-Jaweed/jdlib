# The example's own lab: the two services a request needs beyond the process itself.
#
#   export JDLIB_ENTERPRISE_POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
#   docker compose -f docker/docker-compose.yml up -d
#
# The password is required rather than defaulted: a lab that carries a usable credential in the
# repository teaches the wrong habit, and `:?` makes the omission loud at parse time instead of at
# the first connection.
#
# Ports are offset from the other labs in this repository (5432/3592 belong to the harness and the
# reference application's lab), so all of them can run at once.
name: jdlib-enterprise

services:
  postgres:
    image: postgres:16
    container_name: jdlib-enterprise-postgres
    environment:
      POSTGRES_USER: jdlib
      POSTGRES_PASSWORD: ${JDLIB_ENTERPRISE_POSTGRES_PASSWORD:?export JDLIB_ENTERPRISE_POSTGRES_PASSWORD first (any value; this is a local lab)}
      POSTGRES_DB: jdlib_enterprise
    ports:
      - "127.0.0.1:45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdlib -d jdlib_enterprise"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The policy engine, with this example's own policy set. The mount destination is *not* `/cerbos`:
  # the image's entrypoint is the binary at that path, so a directory mounted there fails with
  # "not a directory" before the container ever starts.
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.54.0
    container_name: jdlib-enterprise-cerbos
    command: ["server", "--config=/config/cerbos.yaml"]
    volumes:
      - ../config/cerbos:/config:ro
      - ../config/cerbos/policies:/policies:ro
    ports:
      - "127.0.0.1:4592:3592"
      - "127.0.0.1:4593:3593"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
